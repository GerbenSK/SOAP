# Values in this section are substituted into the other sections
Parameters:
  sim_dir: /net/hypernova/data2/COLIBRE
  output_dir: /net/hypernova/data1/stemker/SOAP
  scratch_dir: /net/hypernova/data1/stemker/SOAP

# Location of the Swift snapshots:
Snapshots:
  # Use {snap_nr:04d} for the snapshot number and {file_nr} for the file number.
  filename: "{sim_dir}/{sim_name}/snapshots/colibre_{snap_nr:04d}/colibre_{snap_nr:04d}.{file_nr}.hdf5"

# Which halo finder we're using, and base name for halo finder output files
HaloFinder:
  type: HBTplus
  filename: "{sim_dir}/{sim_name}/HBT-HERONS/sorted_catalogues/OrderedSubSnap_{snap_nr:03d}.hdf5"
  # fof_filename: "{sim_dir}/{sim_name}/fof/fof_output_{snap_nr:04d}/fof_output_{snap_nr:04d}.{file_nr}.hdf5"
  # fof_radius_filename: "{sim_dir}/{sim_name}/fof_radii/fof_output_{snap_nr:04d}/fof_output_{snap_nr:04d}.{file_nr}.hdf5"
  # read_potential_energies: true
  #type: VR
  #filename: "{sim_dir}/halo_{snap_nr:04d}"
  #type: Subfind
  #filename: "{sim_dir}/snapdir_{snap_nr:03d}/snapshot_{snap_nr:03d}"

GroupMembership:
  # Where to write the group membership files
  filename: "{output_dir}/{sim_name}/SOAP_uncompressed/membership_{snap_nr:04d}/membership_{snap_nr:04d}.{file_nr}.hdf5"

HaloProperties:
  # Where to write the halo properties file
  filename: "{output_dir}/{sim_name}/SOAP_uncompressed/halo_properties_{snap_nr:04d}.hdf5"
  # Where to write temporary chunk output
  chunk_dir: "{scratch_dir}/{sim_name}/SOAP-tmp/"

SOProperties:
  properties:
    CentreOfMassVelocity: true
    EulerMassThermalSupport: true    # Requires numba and healpy
    EulerMassTurbulentSupport: true  # Requires numba and healpy
    EulerMassRotationalSupport: true # Requires numba and healpy
    EulerMassStreamingSupport: true  # Requires numba and healpy
    TestField1: true  # Requires numba and healpy
    TestField2: true  # Requires numba and healpy
    TestField3: true  # Requires numba and healpy
    TestField4: true  # Requires numba and healpy
    SORadius: true
    TotalMass: true
  variations:
    200_crit:
      type: crit
      value: 200.0
      core_excision_fraction: 0.15
SubhaloProperties:
  properties:
    TotalMass: true
    NumberOfBlackHoleParticles: true
    NumberOfDarkMatterParticles: true
    NumberOfGasParticles: true
    NumberOfStarParticles: true
filters:
  general:
    limit: 100
    properties:
      - BoundSubhalo/NumberOfGasParticles
      - BoundSubhalo/NumberOfDarkMatterParticles
      - BoundSubhalo/NumberOfStarParticles
      - BoundSubhalo/NumberOfBlackHoleParticles
    combine_properties: sum
defined_constants:
  O_H_sun: 4.9e-4
  Fe_H_sun: 3.16e-5
  N_O_sun: 0.138
  C_O_sun: 0.549
  Mg_H_sun: 3.98e-5
calculations:
  calculate_missing_properties: false
  strict_halo_copy: false
  recently_heated_gas_filter:
    delta_time_myr: 15
    use_AGN_delta_T: false
  cold_dense_gas_filter:
    maximum_temperature_K: 3.16e4
    minimum_hydrogen_number_density_cm3: 0.1
  separate_chunks:
    - n_bound_threshold: 300000000
      n_halo_per_chunk: 1
    - n_bound_threshold: 100000000
      n_halo_per_chunk: 2
    - n_bound_threshold: 50000000
      n_halo_per_chunk: 5
