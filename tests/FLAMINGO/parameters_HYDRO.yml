Parameters:
  sim_dir: /net/hypernova/data2/student_projects/stemker/swift/source/examples/FLAMINGO
  output_dir: /net/hypernova/data2/student_projects/stemker/swift/source/examples/FLAMINGO
  scratch_dir: /net/hypernova/data2/student_projects/stemker/swift/source/examples/FLAMINGO

Snapshots:
  filename: "{sim_dir}/{sim_name}/flamingo_{snap_nr:04d}.hdf5"

HaloFinder:
  type: HBTplus
  filename: "{sim_dir}/{sim_name}/hbt_output/{snap_nr:03d}/SubSnap_{snap_nr:03d}.0.hdf5"
  fof_filename: "{sim_dir}/{sim_name}/fof_output_{snap_nr:04d}.hdf5"

GroupMembership:
  # Use the pre-existing membership files
  filename: "{output_dir}/{sim_name}/SOAP_uncompressed/{halo_finder}/membership_{snap_nr:04d}/membership_{snap_nr:04d}.hdf5"

# ExtraInput:
#   xrays: "/cosma8/data/dp004/dc-mcgi1/SOAP/TEST_DATA/Xray/{sim_name}/xray/flamingo_{snap_nr:04}/xray_{snap_nr:04}.{file_nr}.hdf5"

HaloProperties:
  # Where to write the halo properties file
  filename: "{output_dir}/{sim_name}/SOAP_uncompressed/{halo_finder}/halo_properties_{snap_nr:04d}.hdf5"
  # Where to write temporary chunk output
  chunk_dir: "{scratch_dir}/{sim_name}/SOAP-tmp/{halo_finder}/"
